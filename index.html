<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campo e Stalla</title>
<meta name="robots" content="noindex, nofollow">
<script>try { if (localStorage.getItem('ces.lock')) document.documentElement.classList.add('app-locked'); } catch (e) { }</script>
<meta name="description" content="Gestionale per l'azienda agricola e zootecnica: campi sulla mappa con catasto, quaderno di campagna, stalla da latte, magazzino e mezzi.">
<meta name="theme-color" content="#F3EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15191E" media="(prefers-color-scheme: dark)">
<script>try { var t = localStorage.getItem('ces.tema'); if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; document.querySelectorAll('meta[name=theme-color]').forEach(function (m) { m.content = t === 'dark' ? '#15191E' : '#F3EFE4'; }); } } catch (e) { }</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Campo e Stalla">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/geoman/leaflet-geoman.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside id="drawer" class="drawer" aria-label="Menu"></aside>
  <div class="scrim" data-act="drawerClose"></div>
  <div class="main">
    <header class="appbar">
      <button class="ab-btn" id="menuBtn" data-act="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="ab-btn" id="backBtn" data-act="back" hidden aria-label="Indietro"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <h1 id="abTitle" class="ab-title"></h1>
      <select id="yearSel" class="ab-year" aria-label="Annata"></select>
      <span class="sp"></span>
      <button class="ab-btn ab-chiedi" data-act="chiedi" aria-label="Chiedi all'assistente" title="Chiedi all'assistente"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg><span>Chiedi</span></button>
      <button class="ab-btn ab-auto vuoto" id="autoBtn" data-act="nav" data-tab="automatico" aria-label="Automatico" title="Automatico"></button>
      <button class="ab-btn" id="temaBtn" data-act="temaGiro" aria-label="Chiaro o scuro" title="Chiaro o scuro"></button>
      <button class="ab-btn" id="helpBtn" data-act="guApri" aria-label="Come funziona questa pagina" title="Come funziona questa pagina (Guida)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
      <button class="ab-btn" data-act="search" aria-label="Cerca"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="ab-btn sync" id="syncBtn" data-act="nav" data-tab="impostazioni" aria-label="Sincronizzazione"></button>
      <button class="ab-reg" data-act="quick"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Registra</span></button>
    </header>
    <nav id="topnav" class="topnav" aria-label="Menu"></nav>
    <main id="view" class="view" tabindex="-1"></main>
    <section id="mapView" class="mapview" hidden><div id="map"></div><div id="mapControls"></div></section>
  </div>
  <nav id="bnav" class="bnav" aria-label="Navigazione principale"></nav>
  <button class="fab" data-act="quick" aria-label="Registra"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab" aria-hidden="true"></div><div class="sheet-h"><div><h2 id="sheetTitle"></h2><p id="sheetSub" hidden></p></div><button class="iconbtn ghost sh-max" id="sheetMax" type="button" aria-label="Ingrandisci la finestra" title="Ingrandisci (doppio clic sul titolo)"><svg class="ic i-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg><svg class="ic i-rid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="8" width="12.5" height="12.5" rx="1.5"/><path d="M8 8V4.5A1 1 0 0 1 9 3.5h10.5a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H16"/></svg></button><button class="iconbtn ghost" data-act="close" aria-label="Chiudi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="sheet-b" id="sheetBody"></div><div class="sh-x" id="sheetX" hidden><div></div></div></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript>Per usare Campo e Stalla attiva JavaScript.</noscript>
<script src="js/errori-avvio.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/geoman/leaflet-geoman.min.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
