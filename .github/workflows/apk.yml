# Crea l'APK firmato dell'app Android con i file attuali del sito e lo pubblica nelle Release.
# Parte da solo quando cambia app-android/, oppure a mano (Actions → App Android → Run workflow). La chiave di firma è nei segreti
# APK_CHIAVE (file .p12 in base64) e APK_PASSWORD; la copia sul PC è in Desktop\chiave-android.
name: App Android

on:
  # Le pagine l'app le prende dal sito e si aggiornano da sole: l'APK va rifatto solo quando cambia la parte Android
  push:
    branches: [main]
    paths: ['app-android/**']
  workflow_dispatch:
    inputs:
      note:
        description: Testo della Release (facoltativo)
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Chiave di firma
        env:
          APK_CHIAVE: ${{ secrets.APK_CHIAVE }}
          APK_PASSWORD: ${{ secrets.APK_PASSWORD }}
        run: |
          d="$GITHUB_WORKSPACE/../chiave-android"
          mkdir -p "$d"
          echo "$APK_CHIAVE" | base64 -d > "$d/chiave.p12"
          printf 'storeFile=chiave.p12\nstorePassword=%s\nkeyAlias=campoestalla\nkeyPassword=%s\n' "$APK_PASSWORD" "$APK_PASSWORD" > "$d/chiave.properties"

      - name: File del sito nell'app
        working-directory: app-android
        run: |
          npm ci --no-audit --no-fund
          npm run sync

      - name: APK
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Campo-e-Stalla.apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$GITHUB_WORKSPACE/Campo-e-Stalla.apk" | head -3

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          v=$(sed -n "s/.*VERSION = '\([0-9.]*\)'.*/\1/p" js/version.js)
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" Campo-e-Stalla.apk --clobber
          else
            gh release create "v$v" Campo-e-Stalla.apk --target "$GITHUB_SHA" --title "Campo e Stalla $v - app Android" --notes "${NOTE:-App Android con i file della versione $v.}"
          fi
          rm -rf "$GITHUB_WORKSPACE/../chiave-android"
