# Configurazione per l'integrazione GitHub di Supabase (pubblicazione automatica delle funzioni).
# vengono pubblicate le funzioni "catasto" (collegamento al catasto dell'Agenzia delle Entrate) e "chiedi" (chat con Claude).
project_id = "campo-e-stalla"

[functions.catasto]
enabled = true
verify_jwt = false
entrypoint = "./functions/catasto/index.ts"

# chat "Chiedi": passa le domande a Claude con la chiave nei segreti (ANTHROPIC_API_KEY); serve l'accesso all'azienda
[functions.chiedi]
enabled = true
verify_jwt = true
entrypoint = "./functions/chiedi/index.ts"

# rassegna del giorno e prezzi di mercato: la chiama pg_cron ogni mattina con il segreto RASSEGNA_SEGRETO
# (supabase/aggiornamento-rassegna.sql), oppure l'app con l'accesso; i controlli li fa la funzione
[functions.rassegna]
enabled = true
verify_jwt = false
entrypoint = "./functions/rassegna/index.ts"

# controllo della sicurezza: la chiama pg_cron ogni lunedì e il PC con il segreto SICUREZZA_SEGRETO
# (supabase/aggiornamento-sicurezza.sql), oppure l'app del titolare con l'accesso; i controlli li fa la funzione
[functions.sicurezza]
enabled = true
verify_jwt = false
entrypoint = "./functions/sicurezza/index.ts"
